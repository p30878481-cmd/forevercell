const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const uuid=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
function ahora(f){const d=new Date(),p=x=>String(x).padStart(2,'0'),Y=d.getFullYear(),Mo=p(d.getMonth()+1),D=p(d.getDate()),h=p(d.getHours()),mi=p(d.getMinutes()),s=p(d.getSeconds());
 if(f==='yyyyMMdd_HHmm')return `${Y}${Mo}${D}_${h}${mi}`;if(f==='yyyyMMdd_HHmmss')return `${Y}${Mo}${D}_${h}${mi}${s}`;return `${D}/${Mo}/${Y} ${h}:${mi}`}
const serialAFecha=n=>{const d=new Date(Math.round((n-25569)*864e5)),p=x=>String(x).padStart(2,'0');return `${p(d.getUTCDate())}/${p(d.getUTCMonth()+1)}/${d.getUTCFullYear()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`};
const pf=s=>{const m=String(s||'').match(/(\d+)\/(\d+)\/(\d+)/);return m?new Date(+m[3],m[2]-1,+m[1]).getTime():0};
const b64=b=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
const aDataURL=b=>new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(String(r.result));r.onerror=no;r.readAsDataURL(b)});

 catch(e){const msg=e.message==='SESION'?'':e.message;login(msg)}}

 const t=TOK.t,em=EMAIL;
 try{if(AND)AND.cerrarSesion(em,t);else if(window.google&&google.accounts&&google.accounts.oauth2&&t)google.accounts.oauth2.revoke(t,()=>{})}catch(e){}

  if(await gxPost(()=>limpiar(rows))){rows=await leerTodo();RC=rows}

 finally{if(CARGANDO){CARGANDO=false;if(VIEW===1&&!R.length&&!$('#l').textContent.includes('Reintentar'))filt()}}}

function shrink(f,max,q,nulo){return new Promise(ok=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*s));c.height=Math.max(1,Math.round(i.height*s));c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b||(nulo?null:f)),'image/jpeg',q)};i.onerror=()=>{URL.revokeObjectURL(u);ok(nulo?null:f)};i.src=u})}
function comp(f,max){return new Promise(ok=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(ok,'image/png')};i.src=u})}

 const fi=js(O.fotosIn),fo=js(O.fotosOut),n=Math.max(fi.length,fo.length),w=n<=4?23.5:18.8,c=EC[d.estado]||'#000';

 <div style="display:flex;gap:8px"><div style="flex:1">${bx('CLIENTE',`<b>${E(d.cliente)}</b><br>Tel. 1: ${E(d.ref1)}<br>Tel. 2: ${E(d.ref2)}`)}</div><div style="flex:1">${bx('EQUIPO',`<b>${E(d.equipo)}</b><br>Motivo: ${E(d.falla)}<br>Dejó: ${E(d.accesorios)}`)}</div></div>
 ${bx('COBRO',`<div style="display:flex;text-align:center"><div style="flex:1">Total<br><b style="font-size:17px">$${E(d.total)}</b></div><div style="flex:1;border-left:1px solid #000">Anticipo<br><b style="font-size:17px">$${E(d.anticipo)}</b></div><div style="flex:1;border-left:1px solid #000;color:${rs>0?'#c00000':'#000'}">Adeudo<br><b style="font-size:19px">$${rs}</b></div></div>`)}
 ${bx('EVIDENCIA FOTOGRÁFICA',`<b>Al recibir (${fi.length})</b><br>${ph(O.fotosIn)}${fo.length||d.notasEntrega?`<br><b>Al entregar (${fo.length})</b> ${E(d.notasEntrega)}<br>${ph(O.fotosOut)}`:''}`)}</div>`}

function calc(){const r=(+$('#total').value||0)-(+$('#anticipo').value||0);$('#rest').textContent='Resta por pagar: $'+r}
function cnt(){['in','out'].forEach(k=>{const e=$('#c'+k);if(e)e.textContent=(O._n[k]+NEW[k].length)+'/10';const g2=$('#n'+k);if(g2)g2.innerHTML=NEW[k].map((x,i)=>`<div><img src="${x.u}"><b class=x onclick="del('${k}',${i})">✕</b></div>`).join('')})}

async function serie(k){if(O._n[k]+NEW[k].length>=10)return alert('Máximo 10 fotos');

 const d=document.createElement('div');d.id='cam';d.style.cssText='position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column';
 d.innerHTML=`<video id=vd autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:contain"></video><div style="padding:14px 14px 28px;display:flex;align-items:center;justify-content:space-between"><b id=cc style="color:#fff;width:70px"></b><button onclick="snap('${k}')" style="width:76px;height:76px;border-radius:50%;border:5px solid #ccc;background:#fff;font-size:28px">📷</button><button onclick="camOff()" style="width:70px;border:0;border-radius:10px;padding:12px 0;font-weight:700">Listo</button></div>`;

 NEW[k].push({b,u:URL.createObjectURL(b)});navigator.vibrate&&navigator.vibrate(40);cc(k)}finally{SN=0}}
// ----- Patrón de desbloqueo -----
function pat(){const lock=O.id&&/Patr[oó]n:/.test(O.clave||'');PS=secPat($('#clave').value);
 const d=document.createElement('div');d.id='pat';d.style.cssText='position:fixed;inset:0;background:#000c;z-index:99;display:flex;align-items:center;justify-content:center';
 d.innerHTML=`<div style="background:#fff;border-radius:16px;padding:14px;text-align:center"><b>Patrón de desbloqueo</b><br><canvas id=pc width=300 height=300 style="touch-action:none;background:#f2f6fb;border-radius:12px;margin:8px 0;max-width:80vw"></canvas>${lock?'<p style="font-size:12px;color:#637386;margin:0">Patrón guardado: no se puede modificar.</p>':`<div class=row><button class="btn s" onclick="PS=[];pd()">Borrar</button><button class="btn g" onclick="patOk()">Usar patrón</button></div>`}<button class="btn s" onclick="$('#pat').remove()">Cerrar</button></div>`;
 document.body.appendChild(d);const c=$('#pc');pd();
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]};
 if(!lock){c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);PS=[];const p=pos(e);hit(p);pd(p)};c.onpointermove=e=>{if(e.buttons){const p=pos(e);hit(p);pd(p)}};c.onpointerup=()=>pd()}}
const dot=i=>[50+100*(i%3),50+100*Math.floor(i/3)];
function hit(p){for(let i=0;i<9;i++){const q=dot(i);if(Math.hypot(p[0]-q[0],p[1]-q[1])<34&&!PS.includes(i+1))PS.push(i+1)}}
function drawPat(x,seq,p,bg){x.clearRect(0,0,300,300);if(bg){x.fillStyle='#fff';x.fillRect(0,0,300,300)}x.strokeStyle='#1769aa';x.lineWidth=6;x.lineCap='round';x.beginPath();seq.forEach((n,j)=>{const q=dot(n-1);j?x.lineTo(...q):x.moveTo(...q)});if(p&&seq.length)x.lineTo(...p);x.stroke();
 for(let i=0;i<9;i++){const q=dot(i),k=seq.indexOf(i+1);x.beginPath();x.arc(q[0],q[1],k>=0?16:9,0,7);x.fillStyle=k>=0?'#1769aa':'#9fb2c6';x.fill();if(k>=0){x.fillStyle='#fff';x.font='bold 16px Arial';x.textAlign='center';x.fillText(k+1,q[0],q[1]+6)}}}
const pd=p=>drawPat($('#pc').getContext('2d'),PS,p);
function patBlob(seq){return new Promise(ok=>{const c=document.createElement('canvas');c.width=c.height=300;drawPat(c.getContext('2d'),seq,null,1);c.toBlob(ok,'image/png')})}
function patOk(){if(PS.length<2)return alert('Dibuja el patrón uniendo al menos 2 puntos');$('#clave').value='Patrón: '+PS.join('-');$('#pat').remove();touch()}
// ----- Visor de fotos (solo ver: deslizar, pellizcar, calidad original) -----
function ver(id){history.pushState({},'');const L=js(O.fotosIn).concat(js(O.fotosOut)),d=document.createElement('div');let n=Math.max(0,L.indexOf(id));d.id='vw';d.style.cssText='position:fixed;inset:0;background:#000;z-index:99;touch-action:none;overflow:hidden';
 const bt='position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:34px;background:#0006;padding:10px 12px;border-radius:10px';
 d.innerHTML=`<img id=vi style="position:absolute;top:50%;left:50%;max-width:100%;max-height:100%;transform:translate(-50%,-50%)"><div onclick="history.back()" style="position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;color:#fff;font-weight:700;background:#000b;padding:9px 14px;border-radius:9px">✕ Cerrar</div><div id=vc style="position:absolute;top:calc(14px + env(safe-area-inset-top));left:12px;color:#fff;font-weight:700"></div><div id=vp style="${bt};left:6px">‹</div><div id=vn style="${bt};right:6px">›</div><div id=vt style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:12px">Desliza para cambiar de foto · pellizca para acercar</div>`;
 document.body.appendChild(d);
 const im=$('#vi'),Q=new Map();let s=1,x=0,y=0,d0=0,s0=1,sx=0,sy=0;
 const ap=()=>im.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${s})`;
 const show=k=>{n=Math.min(L.length-1,Math.max(0,k));s=1;x=y=0;ap();const me=n,fid=L[n],vivo=()=>me===n&&$('#vi')===im;$('#vc').textContent=(n+1)+' / '+L.length;let hi=false;
  urlMini(fid).then(u=>{if(vivo()&&!hi)im.src=u}).catch(()=>{});
  urlGrande(fid).then(u=>{if(vivo()){hi=true;im.src=u}}).catch(()=>{})};
 $('#vp').onclick=e=>{e.stopPropagation();show(n-1)};$('#vn').onclick=e=>{e.stopPropagation();show(n+1)};
 d.onpointerdown=e=>{Q.set(e.pointerId,[e.clientX,e.clientY]);if(Q.size==1){sx=e.clientX;sy=e.clientY}if(Q.size==2){const[a,b]=[...Q.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);s0=s}};
 d.onpointermove=e=>{if(!Q.has(e.pointerId))return;const o=Q.get(e.pointerId);Q.set(e.pointerId,[e.clientX,e.clientY]);
  if(Q.size==2){const[a,b]=[...Q.values()];s=Math.min(10,Math.max(1,s0*Math.hypot(a[0]-b[0],a[1]-b[1])/d0))}else if(s>1){x+=e.clientX-o[0];y+=e.clientY-o[1]}ap()};
 d.onpointerup=d.onpointercancel=e=>{const one=Q.size==1;Q.delete(e.pointerId);if(one&&s<=1){const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(n+(dx<0?1:-1))}if(s<=1){s=1;x=y=0;ap()}};
 d.ondblclick=()=>{s=s>1?1:3;x=y=0;ap()};show(n)}
// ----- Guardar -----
async function save(){const d=cur();
 if(!d.cliente.trim())return alert('Falta el nombre del cliente');
 if(d.estado==='Entregado'&&O._n.out+NEW.out.length==0&&!confirm('No agregaste fotos de entrega. ¿Guardar así?'))return;
 $('#sv').disabled=true;const m=t=>{const e=$('#msg');if(e)e.textContent=t};
 try{m('Guardando datos…');const g0=await run('guardar',d);O.id=g0.id;O.folder=g0.folder;
  const add={in:[],out:[]},jobs=[],sq=secPat(d.clave);if(sq.length>1&&!O.patron)add.pat=await patBlob(sq);
  for(const k of ['in','out'])NEW[k].forEach((b,i)=>jobs.push([k,b,i]));const tot=jobs.length;let n=0;
  const w=async()=>{while(jobs.length){const[k,b,i]=jobs.shift();add[k][i]=b.id||(b.id=await run('foto',g0.folder,k,b.b));LOCAL[b.id]=b.u;m(`Subiendo fotos ${++n}/${tot}…`)}};
  await Promise.all([w(),w(),w()]);
  m('Generando PDF…');const x=await run('pdf',g0.id,add);
  Object.assign(O,d,{id:g0.id,fecha:x.fecha,fotosIn:x.fotosIn,fotosOut:x.fotosOut,pdf:x.pdfId,ticket:'',patron:x.patron});
  run('lista').then(l=>{R=l;cache()}).catch(()=>{});done(x)}
 catch(e){m('Error: '+(e.message||e));$('#sv').disabled=false}}
function done(x){v(`<div class=card style="text-align:center"><h3>✅ ${E(x.id)} guardada</h3><p style="font-size:13px;color:#637386;margin:0">La orden quedó guardada en tu Google Drive.</p></div><div class=card><b>📣 Avisar / Imprimir</b>${btns()}</div><button class="btn s" onclick="history.back()">Volver a órdenes</button><div id=msg></div>`)}
